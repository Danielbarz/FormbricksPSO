name: Deploy Formbricks Container to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-container:
    name: Deploy Official Image to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Langsung menggunakan image Docker resmi dari Formbricks
          images: 'ghcr.io/formbricks/formbricks:latest'
